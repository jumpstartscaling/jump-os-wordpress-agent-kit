name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: python3 -m py_compile gateway/tenant_gateway.py client/tenantctl.py scripts/build_recipient_pack.py scripts/build_wordpress_bridge_zip.py scripts/build_release_package.py
      - run: php -l wordpress-plugin/jump-os-wordpress-agent-bridge/jump-os-wordpress-agent-bridge.php
      - run: python3 -m unittest discover -s tests -v
